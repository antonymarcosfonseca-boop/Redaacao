<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossiê de Repertórios — PMAL 2026</title>
<style>
  :root{
    --bg: #12161d;
    --bg-panel: #1a212b;
    --bg-card: #202834;
    --line: #2e3846;
    --gold: #c9a227;
    --gold-dim: #8a7220;
    --text: #e7e4db;
    --text-dim: #9aa3af;
    --blue: #4a6fa1;
    --red: #a13d3d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    min-height:100vh;
  }
  .app{
    display:block;
    min-height:100vh;
  }

  /* HAMBURGER TOGGLE */
  #menu-toggle{
    position:fixed;
    top:16px;
    left:16px;
    z-index:40;
    width:40px;
    height:40px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  #menu-toggle:hover{ border-color:var(--gold-dim); }
  #menu-toggle span{
    display:block;
    width:18px;
    height:2px;
    background:var(--gold);
  }
  #overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    z-index:20;
    display:none;
  }
  #overlay.show{ display:block; }

  /* SIDEBAR */
  .sidebar{
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    padding:24px 18px;
    padding-top:64px;
    position:fixed;
    top:0;
    left:0;
    height:100vh;
    width:320px;
    max-width:85vw;
    overflow-y:auto;
    z-index:30;
    transform:translateX(-100%);
    transition:transform .2s ease;
  }
  .sidebar.open{ transform:translateX(0); }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .brand .stamp{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11px;
    letter-spacing:2px;
    color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:2px 6px;
    border-radius:2px;
  }
  h1.brand-title{
    font-size:19px;
    margin:10px 0 2px 0;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .brand-sub{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:20px;
    line-height:1.5;
  }
  input#search{
    width:100%;
    padding:10px 12px;
    background:var(--bg-card);
    border:1px solid var(--line);
    color:var(--text);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13px;
    border-radius:3px;
    margin-bottom:16px;
  }
  input#search:focus{ outline:1px solid var(--gold); border-color:var(--gold);}

  .tema-list{
    list-style:none;
    margin:0; padding:0;
  }
  .tema-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 10px;
    border-radius:3px;
    cursor:pointer;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:13.5px;
    color:var(--text-dim);
    border-left:2px solid transparent;
    transition:background .12s;
  }
  .tema-item:hover{ background:rgba(201,162,39,0.06); color:var(--text);}
  .tema-item.active{
    background:rgba(201,162,39,0.1);
    color:var(--text);
    border-left:2px solid var(--gold);
  }
  .tema-num{
    font-variant-numeric: tabular-nums;
    color:var(--gold-dim);
    font-size:11px;
    min-width:22px;
  }
  .tema-item.active .tema-num{ color:var(--gold); }
  .tema-item .studied-dot{
    margin-left:auto;
    width:6px;height:6px;border-radius:50%;
    background:var(--line);
  }
  .tema-item.studied .studied-dot{ background:var(--gold); }

  .empty-hint{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:12px;
    color:var(--text-dim);
    padding:10px;
  }

  /* MAIN */
  main{
    padding:80px 48px 80px;
    max-width:760px;
    margin:0 auto;
  }
  @media (max-width: 820px){ main{padding:72px 20px 60px;} }

  .case-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:28px;
  }
  .case-file{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--gold);
    margin-bottom:8px;
  }
  h2.tema-title{
    font-size:28px;
    margin:0;
    line-height:1.2;
  }
  button#toggle-studied{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:12px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
  }
  button#toggle-studied.on{
    border-color:var(--gold-dim);
    color:var(--gold);
  }

  .section{
    margin-bottom:26px;
  }
  .section-label{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .section-body{
    font-size:16px;
    line-height:1.65;
    color:var(--text);
  }
  .section-body ul{ margin:6px 0; padding-left:20px; }
  .section-body li{ margin-bottom:6px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:12px;
    background:var(--bg-card);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:20px;
    color:var(--text-dim);
  }

  .frase-box{
    background:var(--bg-card);
    border-left:2px solid var(--gold-dim);
    padding:14px 18px;
    font-style:italic;
    color:var(--text);
    border-radius:2px;
  }
  .frase-autor{
    display:block;
    margin-top:8px;
    font-style:normal;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:12px;
    color:var(--text-dim);
  }

  .quiz-box{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .quiz-q{ font-size:14px; color:var(--text); margin-bottom:12px; }
  .quiz-reveal-btn{
    font-size:12px;
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
  }
  .quiz-answer{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:13.5px;
    color:var(--text-dim);
    display:none;
    line-height:1.6;
  }
  .quiz-answer.show{ display:block; }

  .progress-bar{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:11px;
    color:var(--text-dim);
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }

  .nav-btns{
    display:flex;
    justify-content:space-between;
    margin-top:32px;
  }
  .nav-btns button{
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size:12px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
  }
  .nav-btns button:hover{ border-color:var(--gold-dim); color:var(--gold); }
  .nav-btns button:disabled{ opacity:0.3; cursor:default; }
</style>
</head>
<body>

<button id="menu-toggle" aria-label="Abrir menu"><span></span><span></span><span></span></button>
<div id="overlay"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="stamp">DOSSIÊ Nº 26</span></div>
    <h1 class="brand-title">Repertórios — Redação PMAL 2026</h1>
    <p class="brand-sub">Ficha de referências (conceitos, leis, dados e pensadores) organizada por tema provável de prova discursiva CEBRASPE. Funciona 100% offline.</p>
    <input type="text" id="search" placeholder="Buscar tema ou palavra-chave...">
    <ul class="tema-list" id="tema-list"></ul>
  </aside>

  <main id="main-content"></main>
</div>

<script>

    base_legal: [

    base_legal: [

    pensadores: [

let currentId = TEMAS[0].id;
let studied = new Set();
let filterText = "";

function renderSidebar(){
  const list = document.getElementById('tema-list');
  const filtered = TEMAS.filter(t => {
    if(!filterText) return true;
    const haystack = (t.titulo + " " + t.conceitos.join(" ")).toLowerCase();
    return haystack.includes(filterText.toLowerCase());
  });
  if(filtered.length === 0){
    list.innerHTML = '<li class="empty-hint">Nenhum tema encontrado.</li>';
    return;
  }
  list.innerHTML = filtered.map((t, i) => {
    const num = String(TEMAS.indexOf(t)+1).padStart(2,'0');
    const activeClass = t.id === currentId ? 'active' : '';
    const studiedClass = studied.has(t.id) ? 'studied' : '';
    return `<li class="tema-item ${activeClass} ${studiedClass}" data-id="${t.id}">
      <span class="tema-num">${num}</span>
      <span>${t.titulo}</span>
      <span class="studied-dot"></span>
    </li>`;
  }).join('');
  list.querySelectorAll('.tema-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentId = el.dataset.id;
      renderSidebar();
      renderMain();
      window.scrollTo(0,0);
      if(typeof closeSidebar === 'function') closeSidebar();
    });
  });
}

function renderMain(){
  const t = TEMAS.find(x => x.id === currentId);
  const idx = TEMAS.indexOf(t);
  const num = String(idx+1).padStart(2,'0');
  const isStudied = studied.has(t.id);

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="case-header">
      <div>
        <div class="case-file">DOSSIÊ ${num}/${TEMAS.length} — TEMA PROVÁVEL</div>
        <h2 class="tema-title">${t.titulo}</h2>
      </div>
      <button id="toggle-studied" class="${isStudied ? 'on' : ''}">${isStudied ? '✓ Estudado' : 'Marcar como estudado'}</button>
    </div>

    <div class="section">
      <div class="section-label">Conceitos-chave</div>
      <div class="section-body"><ul>${t.conceitos.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    </div>

    <div class="section">
      <div class="section-label">Dados e fontes citáveis</div>
      <div class="section-body"><ul>${t.dados.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    </div>

    <div class="section">
      <div class="section-label">Base legal</div>
      <div class="section-body"><ul>${t.base_legal.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    </div>

    <div class="section">
      <div class="section-label">Pensadores e conceitos teóricos</div>
      <div class="section-body"><ul>${t.pensadores.map(c=>`<li>${c}</li>`).join('')}</ul></div>
    </div>

    <div class="section">
      <div class="section-label">Frase-síntese</div>
      <div class="frase-box">"${t.frase.texto}"<span class="frase-autor">${t.frase.autor}</span></div>
    </div>

    <div class="section">
      <div class="section-label">Proposta de intervenção típica</div>
      <div class="section-body">${t.intervencao_tipica}</div>
    </div>

    <div class="section">
      <div class="section-label">Teste-se</div>
      ${t.quiz.map((q,i)=>`
        <div class="quiz-box" style="margin-bottom:10px;">
          <div class="quiz-q">${q.p}</div>
          <button class="quiz-reveal-btn" data-qid="${t.id}-${i}">Revelar resposta</button>
          <div class="quiz-answer" id="ans-${t.id}-${i}">${q.r}</div>
        </div>
      `).join('')}
    </div>

    <div class="nav-btns">
      <button id="prev-btn" ${idx===0?'disabled':''}>← Tema anterior</button>
      <button id="next-btn" ${idx===TEMAS.length-1?'disabled':''}>Próximo tema →</button>
    </div>

    <div class="progress-bar">${studied.size} de ${TEMAS.length} temas marcados como estudados nesta sessão.</div>
  `;

  document.getElementById('toggle-studied').addEventListener('click', ()=>{
    if(studied.has(t.id)) studied.delete(t.id); else studied.add(t.id);
    renderSidebar();
    renderMain();
  });

  main.querySelectorAll('.quiz-reveal-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ans = document.getElementById('ans-' + btn.dataset.qid);
      ans.classList.toggle('show');
      btn.textContent = ans.classList.contains('show') ? 'Ocultar resposta' : 'Revelar resposta';
    });
  });

  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{
    if(idx>0){ currentId = TEMAS[idx-1].id; renderSidebar(); renderMain(); window.scrollTo(0,0);}
  });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(idx<TEMAS.length-1){ currentId = TEMAS[idx+1].id; renderSidebar(); renderMain(); window.scrollTo(0,0);}
  });
}

document.getElementById('search').addEventListener('input', (e)=>{
  filterText = e.target.value;
  renderSidebar();
});

const sidebarEl = document.getElementById('sidebar');
const overlayEl = document.getElementById('overlay');
const menuToggleEl = document.getElementById('menu-toggle');

function openSidebar(){
  sidebarEl.classList.add('open');
  overlayEl.classList.add('show');
}
function closeSidebar(){
  sidebarEl.classList.remove('open');
  overlayEl.classList.remove('show');
}
menuToggleEl.addEventListener('click', ()=>{
  if(sidebarEl.classList.contains('open')) closeSidebar(); else openSidebar();
});
overlayEl.addEventListener('click', closeSidebar);

renderSidebar();
renderMain();
</script>
